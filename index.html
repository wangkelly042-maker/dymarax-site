<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="DymaraX — Customer Journey. Experience. Growth. Coming soon." />
  <title>DymaraX | Coming Soon</title>
  <style>
    :root {
      --navy: #03152d;
      --teal: #18d7dc;
      --white: #f7fbff;
      --muted: #a8bdd0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 80% 18%, rgba(24,215,220,.16), transparent 28%),
        radial-gradient(circle at 12% 86%, rgba(20,92,148,.20), transparent 35%),
        linear-gradient(135deg, var(--navy), #020b18 70%);
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 70vw;
      height: 70vw;
      border: 1px solid rgba(24,215,220,.16);
      border-radius: 50%;
      transform: rotate(-18deg);
      pointer-events: none;
    }
    body::before { right: -42vw; bottom: -48vw; }
    body::after { left: -52vw; top: -56vw; }

    main {
      width: min(880px, 88vw);
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 36px 20px 72px;
    }

    /* Smaller emblem to match the preferred balance */
    .emblem {
      display: block;
      width: min(238px, 49vw);
      height: auto;
      margin: 0 auto 6px;
      filter: drop-shadow(0 16px 34px rgba(0,0,0,.22));
    }

    .brand {
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      margin: 0 0 30px;
      line-height: .95;
      white-space: nowrap;
    }
    .brand-text {
      font-size: clamp(2.7rem, 8vw, 5.1rem);
      letter-spacing: -.045em;
      font-weight: 800;
      color: var(--white);
      text-shadow: 0 3px 22px rgba(0,0,0,.18);
    }
    .brand-x {
      height: clamp(2.55rem, 7.6vw, 4.8rem);
      width: auto;
      margin-left: -1px;
      transform: translateY(-1px);
      filter: drop-shadow(0 3px 10px rgba(0,0,0,.20));
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: clamp(.72rem, 1.3vw, .9rem);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--teal);
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5.4rem);
      line-height: .96;
      letter-spacing: -.045em;
      font-weight: 750;
    }

    .tagline {
      margin: 24px auto 0;
      max-width: 700px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      letter-spacing: .02em;
    }

    .line {
      width: 72px;
      height: 2px;
      margin: 34px auto;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
    }

    .soon {
      margin: 0;
      font-size: clamp(1rem, 1.8vw, 1.15rem);
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }


    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      padding: 11px 20px;
      border: 1px solid rgba(24,215,220,.48);
      border-radius: 999px;
      color: var(--white);
      text-decoration: none;
      font-size: .86rem;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .contact-link:hover, .contact-link:focus-visible {
      background: rgba(24,215,220,.10);
      border-color: var(--teal);
      transform: translateY(-1px);
      outline: none;
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(168,189,208,.65);
      font-size: .78rem;
      z-index: 1;
    }
footer a {
  color: inherit;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 650;
}
    @media (max-width: 600px) {
      body {

        display: block;

        overflow-y: auto;

      }

      main {

        width: min(880px, 88vw);

        margin: 0 auto;

        min-height: 100svh;

        display: flex;

        flex-direction: column;

        justify-content: center;

        padding: 26px 20px 36px;

      }

      footer {

        position: static;

        padding-bottom: 20px;

      }
      
      .emblem { width: min(215px, 47vw); margin-bottom: 8px; }
      .brand { margin-bottom: 30px; }
      .brand-text { font-size: clamp(2.8rem, 8.8vw, 4.0rem); }
      .brand-x { height: clamp(2.6rem, 8.1vw, 3.95rem); }
      .eyebrow { letter-spacing: .20em; }
    }
  </style>
</head>
